<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Srimashis Mishra</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
</body>
<script>
    const print = function(){
        console.log("Srimashis Mishra", Date.now());
    }
    let intervalID;
    document.querySelector('#start').addEventListener('click',function(){
        intervalID=setInterval(print,2000)
    })
    document.querySelector('#stop').addEventListener('click',function(){
        clearInterval(intervalID)
    })

    //setInterval() -> Used to run a function again and again after a fixed time interval.
    //clearInterval() -> Used to stop a setInterval().
</script>
</html>
