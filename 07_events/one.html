<!-- NOTES
1) onclick

document.getElementById('VK').onclick = function(){}

* Used to perform an action when an element is clicked.
* Only one onclick event can exist at a time.

2) addEventListener()

element.addEventListener('click', function(){})

* Modern and best way to handle events.
* Multiple events can be added on same element.
* 'click' = event type
* function(e) = callback function

3) Event Object (e)

function(e){}

* e stores information about the event.
* Gives details about where click happened.

Important properties:
* e.target → exact clicked element
* e.target.tagName → returns tag name like IMG, LI
* e.target.id → returns id of clicked element

4) Event Bubbling

When child is clicked:
IMG → LI → UL → BODY

Event moves upward automatically.

5) stopPropagation()

e.stopPropagation()

* Stops event bubbling.
* Parent event will not run.

6) preventDefault()

e.preventDefault()

* Stops default behavior.
Example:
* Prevents Google link from opening.

7) querySelector()

document.querySelector('#images')

* Selects first matching element.
* # = id
* . = class

8) parentNode

e.target.parentNode

* Selects parent element.
Example:
IMG parent is LI.

9) remove()

removeit.remove()

* Removes selected element from webpage.

MAIN CONCEPT OF THIS CODE

This code demonstrates:
* Event Handling
* Event Bubbling
* Event Delegation
* DOM Manipulation
* Removing Elements Dynamically -->
